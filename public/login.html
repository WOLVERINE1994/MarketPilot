<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>MarketPilot · sign in</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0d1117; color:#e6edf3; font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px; box-sizing:border-box; }
  form { box-sizing:border-box; width:min(340px, calc(100vw - 48px)); background:#161b22; border:1px solid #262d36; border-radius:16px; padding:24px; }
  img { width:56px; height:56px; border-radius:12px; display:block; margin-bottom:12px; }
  h1 { font-size:20px; margin:0 0 4px; } p { color:#8b949e; margin:0 0 18px; font-size:14px; }
  input { width:100%; box-sizing:border-box; padding:12px; border-radius:10px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; font:inherit; }
  button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:10px; background:#2ea043; color:#fff; font:inherit; font-weight:600; }
  .err { color:#ff7b72; font-size:14px; margin-top:10px; min-height:1em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img src="/icon-192.png" alt="">
  <h1>MarketPilot</h1>
  <p>Enter your dashboard password. You stay signed in on this phone for 30 days.</p>
  <input type="password" name="password" autocomplete="current-password" placeholder="Password" required autofocus>
  <button type="submit">Sign in</button>
  <div class="err"><!--ERROR--></div>
</form>
</body>
</html>
